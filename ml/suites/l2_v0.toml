# L2 v0: electrical faults E1-E3 and fault-free houses over two weeks, with legitimate
# anomalies (heatwaves and guests raise loads; natural ones always occur).
#
# Same split rules as l1_v0: no shared weather year or seed; test adds an unseen archetype and
# is sealed (ml/sealed/l2_v0.json).

name = "l2_v0"
layers = ["L2"]
days = 14
fault_types = ["E1", "E2", "E3"]
fault_start_days = [2.0, 7.0]
anomaly_prob = 0.35
anomaly_types = ["guests", "heatwave", "festive_cooking", "aircon_setpoint_change", "occupancy_change"]
anomaly_days = [1, 3]
# The board monitor (currents, residual currents, trips) and weather context.
sensors = ["sensor_db_monitor", "sensor_weather_feed"]

[split.train]
years = [2023]
archetypes = ["working_family", "retired_couple", "young_couple", "large_family"]
episodes_per_fault_type = 12
fault_free_episodes = 12

[split.validation]
years = [2024]
archetypes = ["working_family", "retired_couple", "young_couple", "large_family"]
episodes_per_fault_type = 8
fault_free_episodes = 8

[split.test]
years = [2025]
archetypes = ["working_family", "retired_couple", "young_couple", "large_family", "shift_family"]
episodes_per_fault_type = 10
fault_free_episodes = 10
