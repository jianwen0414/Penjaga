[project]
name = "penjaga-stream"
version = "0.1.0"
description = "Penjaga M4: house-time clock, reading ingest, storage, fan-out and summary queries."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "penjaga-contract",
    "fastapi>=0.143.1,<0.144",
    "uvicorn[standard]>=0.54.0,<0.55",
    "duckdb>=1.5.6,<1.6",
    "pyarrow>=26.0.0,<27",
    "numpy>=2.5.4,<3",
    "anyio>=4.15.1,<5",
    "websockets>=17.2,<18",
]

[project.scripts]
penjaga-stream = "penjaga_stream.cli:main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penjaga_stream"]

[tool.uv.sources]
penjaga-contract = { workspace = true }
