[project]
name = "penjaga-api"
version = "0.1.0"
description = "Penjaga Core API: follows detection's findings and serves the homeowner app, portal and Lab."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "penjaga-contract",
    "fastapi>=0.143.1,<0.144",
    "uvicorn[standard]>=0.54.0,<0.55",
    "httpx2>=2.13.1,<2.14",
    "anyio>=4.15.1,<5",
]

[project.scripts]
penjaga-api = "penjaga_api.cli:main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penjaga_api"]

[tool.uv.sources]
penjaga-contract = { workspace = true }
