[project]
name = "penjaga-detect"
version = "0.1.0"
description = "Penjaga M5: detection services (findings from readings; baselines, safety floor, models)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "penjaga-contract",
    "numpy>=2.5.4,<3",
    "scikit-learn>=1.9.1,<1.10",
]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penjaga_detect"]

[tool.uv.sources]
penjaga-contract = { workspace = true }
