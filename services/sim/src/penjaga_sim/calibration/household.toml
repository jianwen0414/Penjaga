# Household behaviour (PRD §12.1). Times are minutes after local midnight.
# No Malaysian time-use microdata was found, so schedules are assumptions; their totals are
# validated against sourced per-capita water (DS-012) and household electricity (DS-014).

# ------------------------------------------------------------------ archetypes (not parameters)
# occupants: roles; bedrooms/bathrooms: contract room ids used by each occupant, in order.
# routine: whether the occupant keeps frequent short basin sessions at fixed times (e.g. ablutions).

[archetypes.working_family]
description = "PRD persona: two working adults out ~8am-7pm, a school-age child, an elder at home in the ground-floor Flexi-Suite."
roles = ["worker", "worker", "child", "elder"]
bedrooms = ["room_bed_master", "room_bed_master", "room_bed2", "room_bed4"]
bathrooms = ["room_bath_master", "room_bath_master", "room_bath2", "room_bath4"]
routine = [true, false, false, true]

[archetypes.retired_couple]
description = "Two retirees at home most of the day."
roles = ["elder", "elder"]
bedrooms = ["room_bed_master", "room_bed_master"]
bathrooms = ["room_bath_master", "room_bath_master"]
routine = [true, true]

[archetypes.young_couple]
description = "Two working adults, out on weekdays, often out on weekends."
roles = ["worker", "worker"]
bedrooms = ["room_bed_master", "room_bed_master"]
bathrooms = ["room_bath_master", "room_bath_master"]
routine = [false, false]

[archetypes.large_family]
description = "Two working adults, two children, an elder; every bathroom in use."
roles = ["worker", "worker", "child", "child", "elder"]
bedrooms = ["room_bed_master", "room_bed_master", "room_bed2", "room_bed3", "room_bed4"]
bathrooms = ["room_bath_master", "room_bath_master", "room_bath2", "room_bath3", "room_bath4"]
routine = [true, true, true, false, true]

[archetypes.shift_family]
description = "A night-shift worker who sleeps by day, a day worker and a child (daytime sleep, night activity)."
roles = ["shift_worker", "worker", "child"]
bedrooms = ["room_bed_master", "room_bed_master", "room_bed2"]
bathrooms = ["room_bath_master", "room_bath_master", "room_bath2"]
routine = [false, false, false]

# ------------------------------------------------------------------ schedules by role
[roles.worker]
wake_weekday = { dist = "normal", mean = 375, sd = 25, low = 300, high = 450, unit = "min", basis = "assumption", note = "Typical urban commuter waking around 06:15 for an 8am start; no Malaysian time-use microdata found." }
leave_weekday = { dist = "normal", mean = 465, sd = 20, low = 420, high = 540, unit = "min", basis = "assumption", note = "Leaves around 07:45 (PRD persona: out ~8am-7pm)." }
return_weekday = { dist = "normal", mean = 1125, sd = 40, low = 1020, high = 1260, unit = "min", basis = "assumption", note = "Returns around 18:45 (PRD persona: out ~8am-7pm)." }
sleep = { dist = "normal", mean = 1395, sd = 40, low = 1290, high = 1439, unit = "min", basis = "assumption", note = "Bedtime around 23:15; capped before midnight because days are simulated midnight to midnight." }
wake_weekend = { dist = "normal", mean = 480, sd = 60, low = 360, high = 660, unit = "min", basis = "assumption", note = "Later weekend waking around 08:00." }
weekend_outing_prob = { dist = "fixed", value = 0.6, unit = "1", basis = "assumption", note = "Share of weekend days with an outing (shopping, visits)." }
weekend_outing_start = { dist = "uniform", low = 600, high = 960, unit = "min", basis = "assumption", note = "Outings start between 10:00 and 16:00." }
weekend_outing_hours = { dist = "uniform", low = 2, high = 6, unit = "h", basis = "assumption", note = "Outing length 2-6 h." }
night_voids_mean = { dist = "fixed", value = 0.65, unit = "1/night", basis = "derived", source = "DS-026", note = "Poisson mean fitted to working-age adults: about 42-54% wake to void at least once and 13-22% at least twice (DS-026, Hong Kong men 18-60); 57.3% of Malaysian adults report nocturia (DS-027)." }

[roles.child]
wake_weekday = { dist = "normal", mean = 375, sd = 15, low = 330, high = 420, unit = "min", basis = "assumption", note = "School-day waking around 06:15." }
leave_weekday = { dist = "normal", mean = 420, sd = 10, low = 400, high = 450, unit = "min", basis = "assumption", note = "Leaves for school around 07:00 (Malaysian session starts ~07:30)." }
return_weekday = { dist = "normal", mean = 840, sd = 30, low = 780, high = 960, unit = "min", basis = "assumption", note = "Back from school around 14:00." }
sleep = { dist = "normal", mean = 1290, sd = 30, low = 1230, high = 1380, unit = "min", basis = "assumption", note = "Bedtime around 21:30." }
wake_weekend = { dist = "normal", mean = 495, sd = 45, low = 390, high = 600, unit = "min", basis = "assumption", note = "Weekend waking around 08:15." }
weekend_outing_prob = { dist = "fixed", value = 0.5, unit = "1", basis = "assumption", note = "Children join some weekend outings." }
weekend_outing_start = { dist = "uniform", low = 600, high = 960, unit = "min", basis = "assumption", note = "Same window as adult outings." }
weekend_outing_hours = { dist = "uniform", low = 2, high = 5, unit = "h", basis = "assumption", note = "Outing length 2-5 h." }
night_voids_mean = { dist = "fixed", value = 0.15, unit = "1/night", basis = "assumption", note = "School-age children rarely wake to void; no Malaysian figure found, so a low rate is assumed." }

[roles.elder]
wake_weekday = { dist = "normal", mean = 360, sd = 25, low = 300, high = 420, unit = "min", basis = "assumption", note = "Early riser around 06:00." }
sleep = { dist = "normal", mean = 1320, sd = 30, low = 1260, high = 1410, unit = "min", basis = "assumption", note = "Bedtime around 22:00." }
wake_weekend = { dist = "normal", mean = 360, sd = 25, low = 300, high = 420, unit = "min", basis = "assumption", note = "Elder routine does not change at weekends." }
outing_prob = { dist = "fixed", value = 0.25, unit = "1", basis = "assumption", note = "Share of days with a morning outing (market, clinic)." }
outing_start = { dist = "uniform", low = 450, high = 600, unit = "min", basis = "assumption", note = "Morning outings 07:30-10:00." }
outing_hours = { dist = "uniform", low = 1, high = 3, unit = "h", basis = "assumption", note = "Outing length 1-3 h." }
nap_prob = { dist = "fixed", value = 0.6, unit = "1", basis = "assumption", note = "Share of days with an afternoon nap (bedroom aircon may run)." }
night_voids_mean = { dist = "fixed", value = 1.6, unit = "1/night", basis = "derived", source = "DS-026", note = "Poisson mean fitted to men over 60: 79-85% void at least once and 44-56% at least twice a night (DS-026)." }

[roles.shift_worker]
sleep_day_start = { dist = "normal", mean = 510, sd = 20, low = 470, high = 560, unit = "min", basis = "assumption", note = "After a night shift, sleeps from around 08:30." }
wake_afternoon = { dist = "normal", mean = 900, sd = 30, low = 840, high = 960, unit = "min", basis = "assumption", note = "After day sleep, wakes around 15:00." }
leave_evening = { dist = "normal", mean = 1290, sd = 15, low = 1260, high = 1320, unit = "min", basis = "assumption", note = "Leaves for a 22:00 shift around 21:30." }
return_morning = { dist = "normal", mean = 450, sd = 15, low = 420, high = 480, unit = "min", basis = "assumption", note = "Returns around 07:30." }
night_voids_mean = { dist = "fixed", value = 0.65, unit = "1/night", basis = "derived", source = "DS-026", note = "As working-age adults, applied to whichever block the shift worker sleeps in." }

# ------------------------------------------------------------------ bathroom routines (per person)
[bath]
showers_per_day = { dist = "fixed", value = 2, unit = "1/day", basis = "assumption", note = "Showering twice daily is common in Malaysia's climate; showering is the dominant end use in DS-013 (124.8 L/person/day)." }
shower_prob = { dist = "fixed", value = 0.92, unit = "1", basis = "assumption", note = "Each of the two daily showers happens with this probability." }
shower_minutes = { dist = "lognormal", median = 7.5, sigma = 0.35, low = 3, high = 25, unit = "min", basis = "source", source = "DS-025", note = "Median near the reported ~8 min average; wide spread because the source is weak." }
heater_prob_morning = { dist = "fixed", value = 0.65, unit = "1", basis = "assumption", note = "Share of morning showers using the instant heater." }
heater_prob_evening = { dist = "fixed", value = 0.35, unit = "1", basis = "assumption", note = "Evenings are warm; fewer heated showers." }
wc_uses_per_awake_home_day = { dist = "fixed", value = 5.0, unit = "1/day", basis = "assumption", note = "About five WC uses per person over a full waking day at home, scaled by time at home." }
wc_full_flush_prob = { dist = "fixed", value = 0.4, unit = "1", basis = "assumption", note = "Share of full (vs half) flushes on a dual-flush cistern." }
bidet_prob = { dist = "fixed", value = 0.85, unit = "1", basis = "assumption", note = "Hand bidet spray use per WC visit (common in Malaysian bathrooms)." }
bidet_seconds = { dist = "uniform", low = 15, high = 45, unit = "s", basis = "assumption", note = "Spray duration per use." }
night_basin_prob = { dist = "fixed", value = 0.5, unit = "1", basis = "assumption", note = "Share of night-time toilet visits followed by a hand wash at the basin." }
basin_uses_per_awake_home_day = { dist = "fixed", value = 7.0, unit = "1/day", basis = "assumption", note = "Handwashing and teeth; sized with DS-013 (31.5 L/person/day for hand washing and teeth)." }
basin_seconds = { dist = "lognormal", median = 30, sigma = 0.5, low = 5, high = 180, unit = "s", basis = "assumption", note = "Short taps; occasional long ones." }
routine_seconds = { dist = "uniform", low = 50, high = 100, unit = "s", basis = "assumption", note = "Each session uses the basin tap at reduced flow." }
routine_jitter = { dist = "uniform", low = -12, high = 12, unit = "min", basis = "assumption", note = "Day-to-day variation of session start times." }

[routine_clock]
note = "Clock times (minutes after midnight) of the routine basin sessions: about 05:45, 13:15, 16:40, 19:20, 20:35, following the daily rhythm described in PRD section 8.2 (pre-dawn session included). Assumption."
times = [345, 795, 1000, 1160, 1235]

# ------------------------------------------------------------------ kitchen, laundry, outdoor (household)
