[outdoor]
garden_prob_weekend = { dist = "fixed", value = 0.45, unit = "1", basis = "assumption", note = "Weekend mornings with plant watering at the garden tap." }
garden_prob_weekday = { dist = "fixed", value = 0.1, unit = "1", basis = "assumption", note = "Occasional weekday watering (elder at home)." }
garden_minutes = { dist = "uniform", low = 4, high = 12, unit = "min", basis = "assumption", note = "Garden watering duration per session." }
