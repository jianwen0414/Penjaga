lunch_sink_minutes = { dist = "uniform", low = 2, high = 6, unit = "min", basis = "assumption", note = "Lunch prep when someone is home." }
dinner_prep_minutes = { dist = "uniform", low = 5, high = 15, unit = "min", basis = "assumption", note = "Food prep at the wet-kitchen sink before dinner." }
dishwash_minutes_per_person = { dist = "uniform", low = 2.5, high = 5, unit = "min", basis = "assumption", note = "Dishwashing at the dry-kitchen sink after dinner, scaled by household size; sized with DS-013 (~30 L/person/day dish washing)." }
sink_duty = { dist = "uniform", low = 0.5, high = 0.8, unit = "1", basis = "assumption", note = "The tap is on for part of a sink session (rinse, scrub, rinse)." }
cook_dinner_prob = { dist = "fixed", value = 0.85, unit = "1", basis = "assumption", note = "Share of evenings with home cooking (rice cooker used)." }
kettle_uses = { dist = "uniform", low = 1, high = 4, unit = "1/day", basis = "assumption", note = "Hot drinks and cooking water." }
microwave_uses = { dist = "uniform", low = 0, high = 3, unit = "1/day", basis = "assumption", note = "Microwave reheating uses per day." }
airfryer_prob = { dist = "fixed", value = 0.35, unit = "1", basis = "assumption", note = "Share of days the air fryer is used." }

[laundry]
cycles_per_person_day = { dist = "fixed", value = 0.22, unit = "1/day", basis = "assumption", note = "About one load a day for 4-5 people; a Selangor survey found 57% of households wash once a day." }
