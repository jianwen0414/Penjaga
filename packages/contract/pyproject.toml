[project]
name = "penjaga-contract"
version = "1.4.0"
description = "Penjaga House Data Contract (M0): JSON Schemas, canonical house record, stream catalogue, generated types and validators."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.26.0,<5",
    "referencing>=0.37.0,<1",
    "pydantic>=2.14.1,<3",
    "tzdata>=2026.5; sys_platform == 'win32'",
]

[project.scripts]
penjaga-contract = "penjaga_contract.cli:main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penjaga_contract"]
