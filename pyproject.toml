[project]
name = "penjaga"
version = "0.1.0"
description = "Penjaga monorepo: Python workspace root (contract, simulator, stream, detection, evaluation)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "penjaga-contract",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contract",
]

[tool.uv.sources]
penjaga-contract = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "hypothesis>=6.169.4,<7",
    "ruff==0.17.0",
    "mypy>=2.4.0,<3",
    "import-linter>=2.15,<3",
    "datamodel-code-generator==0.83.0",
    "types-jsonschema>=4.26.0.20261006",
    "packaging>=26.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "packages/contract/src/penjaga_contract/generated",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "N"]
ignore = [
    "PLR0913", # many-argument functions are sometimes the clearest API
    "PLR2004", # domain constants are named where they matter
]

[tool.ruff.lint.isort]
known-first-party = ["penjaga_contract", "penjaga_sim", "penjaga_stream", "penjaga_detect", "penjaga_eval"]

[tool.ruff.lint.pylint]
# Validators are checklists: one branch per rule reads better than artificial splitting.
max-branches = 20
max-statements = 60
max-returns = 8

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Generated code is checked as a dependency (its types flow into ours) but not held to
# hand-written strictness rules it cannot control.
module = ["penjaga_contract.generated.*"]
disallow_any_explicit = false
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
testpaths = ["tests", "packages/contract/tests"]
filterwarnings = ["error"]

[tool.importlinter]
root_packages = ["penjaga_contract"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Contract core never depends on the lab namespace"
type = "forbidden"
source_modules = [
    "penjaga_contract.core",
    "penjaga_contract.generated.core",
    "penjaga_contract.catalogue",
    "penjaga_contract.cli",
    "penjaga_contract.examples",
    "penjaga_contract.house",
    "penjaga_contract.resources",
    "penjaga_contract.schema_registry",
    "penjaga_contract.validate",
]
forbidden_modules = ["penjaga_contract.lab", "penjaga_contract.generated.lab"]
